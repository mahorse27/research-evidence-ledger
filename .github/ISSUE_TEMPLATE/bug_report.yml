name: Bug report
description: Report incorrect CLI or validation behavior.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach unpublished research data, credentials, or personally identifying information.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include a redacted ledger fixture and the exact command when possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.12 on Windows 11"
    validations:
      required: true
