name: Feature request
description: Propose an evidence workflow or integration.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Research workflow
      description: What evidence-management task is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable CLI or schema behavior rather than an implementation.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal redacted example
      description: Provide a synthetic example without unpublished or sensitive data.
